pluginManagement {
    repositories {
        // primero Maven Central: el portal de plugins a veces da 404 con gson-2.9.1.jar (dependencia de ForgeGradle)
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}