pluginManagement {
    repositories {
        // gson SIEMPRE de Maven Central: el portal de plugins a veces da 404 con gson-2.9.1.jar (dependencia de ForgeGradle)
        // y la caché de Gradle del CI recordaba ese repositorio aunque Maven Central fuera primero
        exclusiveContent {
            forRepository { mavenCentral() }
            filter { includeGroup 'com.google.code.gson' }
        }
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}