name: Prueba del Core con el cliente (fotos)

# Abre el juego de verdad (sin pantalla) con Axelis Core en un mundo plano y corre el escenario de prueba "core" (galería de
# Personas, gestos, caminar, correr, daño). Las fotos y el registro quedan en la rama fotos-core-<versión>.
# Con la entrada "mod" prueba igual un mod que use el Core (sus fotos quedan en fotos-<mod>-<versión>).
on:
  workflow_dispatch:
    inputs:
      versiones:
        description: 'Versiones separadas por espacio (1.20.1 1.21.1 26.3)'
        default: '1.20.1 1.21.1 26.3'
      escenario:
        description: 'Escenarios de prueba (separados por coma)'
        default: 'core'
      mod:
        description: 'Mod a probar (axelis_core o uno que lo use, por ejemplo pesca)'
        default: 'axelis_core'

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - id: m
        run: |
          j="["; sep=""
          for v in ${{ github.event.inputs.versiones }}; do
            case "$v" in
              1.20.1) java=17 ;;
              1.21.1|1.21.4) java=21 ;;
              *) java=25 ;;
            esac
            j="$j$sep{\"mc\":\"$v\",\"java\":\"$java\"}"; sep=","
          done
          echo "matriz=$j]" >> "$GITHUB_OUTPUT"

  cliente:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preparar.outputs.matriz) }}
    env:
      P: ${{ matrix.mc == '1.20.1' && github.event.inputs.mod || format('gen/{0}-{1}', github.event.inputs.mod, matrix.mc) }}
      CORE: ${{ matrix.mc == '1.20.1' && 'axelis_core' || format('gen/axelis_core-{0}', matrix.mc) }}
    steps:
      - uses: actions/checkout@v4
      # el 8 lo pide el lanzador de ForgeGradle 7 (si falta, Gradle intenta bajarlo y a veces falla)
      - uses: actions/setup-java@v4
        id: j8
        continue-on-error: true
        with:
          distribution: temurin
          java-version: 8
      # si la descarga de Temurin falla (a veces llega dañada), se prueba con otra distribución
      - uses: actions/setup-java@v4
        if: steps.j8.outcome == 'failure'
        continue-on-error: true
        with:
          distribution: zulu
          java-version: 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Java 8 visible para Gradle (toolchain del lanzador)
        run: mkdir -p ~/.gradle && echo "org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64" >> ~/.gradle/gradle.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Paquetes para dibujar sin pantalla
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils mesa-vulkan-drivers ffmpeg
      - name: Generar los proyectos de ${{ matrix.mc }}
        if: matrix.mc != '1.20.1'
        run: |
          python3 tools/mkproject.py axelis_core ${{ matrix.mc }} $CORE
          if [ "${{ github.event.inputs.mod }}" != "axelis_core" ]; then python3 tools/mkproject.py ${{ github.event.inputs.mod }} ${{ matrix.mc }} $P; fi
      - name: Compilar Axelis Core (el mod lo usa)
        if: github.event.inputs.mod != 'axelis_core'
        working-directory: ${{ env.CORE }}
        run: ./gradlew build --no-daemon
      - name: Mundo plano (lo crea el servidor de prueba)
        run: |
          mkdir -p $P/run
          cat > $P/run/server.properties <<'EOF'
          level-type=minecraft\:flat
          generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:dirt","height"\:2},{"block"\:"minecraft\:grass_block","height"\:1}],"biome"\:"minecraft\:plains"}
          generate-structures=false
          spawn-protection=0
          online-mode=false
          spawn-monsters=false
          spawn-animals=false
          spawn-npcs=false
          EOF
          bash tools/boot_server.sh $P
          mkdir -p $P/run/saves
          rm -rf $P/run/saves/prueba
          cp -r $P/run/world $P/run/saves/prueba
          rm -f $P/run/saves/prueba/session.lock
      - name: Opciones del juego y de la prueba
        run: |
          mkdir -p $P/run/config
          cat > $P/run/options.txt <<'EOF'
          onboardAccessibility:false
          tutorialStep:none
          pauseOnLostFocus:false
          renderDistance:6
          simulationDistance:5
          guiScale:3
          renderClouds:"false"
          soundCategory_master:0.0
          skipMultiplayerWarning:true
          joinedFirstServer:true
          narrator:0
          maxFps:60
          EOF
          printf 'earlyWindowControl = false\n' > $P/run/config/fml.toml
          if [ "${{ matrix.mc }}" = "1.20.1" ]; then
          cat >> $P/build.gradle <<'EOF'

          minecraft {
              runs {
                  client {
                      property 'axcore.autotest', '${{ github.event.inputs.escenario }}'
                      args '--quickPlaySingleplayer', 'prueba', '--width', '1280', '--height', '720'
                  }
              }
          }
          EOF
          else
          cat >> $P/build.gradle <<'EOF'

          minecraft {
              runs {
                  named('client') {
                      systemProperty 'axcore.autotest', '${{ github.event.inputs.escenario }}'
                      args '--quickPlaySingleplayer', 'prueba', '--width', '1280', '--height', '720'
                  }
              }
          }
          EOF
          fi
      - name: Abrir el juego y tomar las fotos
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set +e
          cd $P
          timeout 1800 xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClient --no-daemon > cliente.log 2>&1
          echo "salida del juego: $?"
          echo "----- AUTOTEST -----"
          grep -E "AXCORE_" run/logs/latest.log | sed 's/^.*AXCORE_/AXCORE_/' | head -150
          echo "----- errores -----"
          grep -nE "Exception|/ERROR\]|/FATAL\]" run/logs/latest.log | grep -viE "realms|telemetry|OpenAL|sound|narrator|authlib|Failed to fetch|profile" | head -40
          ls -la run/screenshots
          grep -q "AXCORE_AUTOTEST_FIN" run/logs/latest.log || { echo "::error title=Prueba del Core ${{ matrix.mc }}::no llegó al final (ver cliente_tail.log en la rama fotos-core-${{ matrix.mc }})"; tail -80 cliente.log; exit 1; }
      - name: Subir fotos a su rama (fotos-core-<versión> o fotos-<mod>-<versión>)
        if: always()
        run: |
          d=$(mktemp -d)
          cp $P/run/screenshots/*.png "$d"/ 2>/dev/null || true
          cp $P/run/logs/latest.log "$d"/ 2>/dev/null || true
          ls $P/crash-reports/*.txt >/dev/null 2>&1 && cp $P/crash-reports/*.txt "$d"/ || true
          ls $P/run/crash-reports/*.txt >/dev/null 2>&1 && cp $P/run/crash-reports/*.txt "$d"/ || true
          tail -400 $P/cliente.log > "$d/cliente_tail.log" 2>/dev/null || true
          cd "$d"
          echo "${{ github.sha }} ${{ matrix.mc }}" > LEEME.txt
          b="fotos-${{ github.event.inputs.mod == 'axelis_core' && 'core' || github.event.inputs.mod }}-${{ matrix.mc }}"
          git init -q -b "$b"
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm "fotos ${{ github.sha }} ${{ matrix.mc }}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$b"
          ls -la
      - name: Ninguna prueba falló
        run: |
          l=$(grep -o "AXCORE_AUTOTEST_FIN.*" $P/run/logs/latest.log | tail -1)
          echo "$l"
          echo "$l" | grep -q "fallos=0" || { grep "AXCORE_AUTOTEST FALLO" $P/run/logs/latest.log | head -10; echo "::error title=Prueba con cliente ${{ matrix.mc }}::$l"; exit 1; }
