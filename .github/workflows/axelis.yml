name: Compilar Axelis
on:
  push:
    branches: [axelis-compile]
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: cd axelis_c && chmod +x gradlew && ./gradlew compileJava --no-daemon
