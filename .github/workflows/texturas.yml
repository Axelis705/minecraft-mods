name: Texturas de Minecraft (para vistas previas)
# Baja el jar del cliente 1.20.1 y sube sus modelos, estados y texturas de bloques (en un zip) a la rama mc-bloques-1.20.1.
# Sirve para dibujar vistas previas de las estructuras sin abrir el juego (la nube de Claude no puede bajar artefactos, sí ramas).
on:
  workflow_dispatch:

jobs:
  texturas:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Bajar el cliente 1.20.1 y subir los bloques a una rama
        run: |
          url=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r '.versions[] | select(.id=="1.20.1") | .url')
          jar=$(curl -s "$url" | jq -r '.downloads.client.url')
          curl -s -o client.jar "$jar"
          mkdir out
          unzip -q client.jar 'assets/minecraft/textures/block/*' 'assets/minecraft/textures/entity/chest/*' 'assets/minecraft/models/block/*' \
            'assets/minecraft/blockstates/*' 'assets/minecraft/textures/colormap/*' -d out
          (cd out && zip -qr ../mc-bloques-1.20.1.zip assets)
          d=$(mktemp -d); cp mc-bloques-1.20.1.zip "$d/"; cd "$d"
          git init -q -b mc-bloques-1.20.1
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm "bloques de Minecraft 1.20.1"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" mc-bloques-1.20.1
          ls -la
