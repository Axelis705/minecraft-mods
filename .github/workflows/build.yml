name: Compilar mods

# Compila cada mod con Gradle real cada vez que se sube un cambio. El .jar queda descargable en la pestaña Actions.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [casino, pooltable, kensei, scardax]
    steps:
      - uses: actions/checkout@v4
      - name: Revisar recursos de ${{ matrix.mod }}
        run: python3 tools/check_resources.py ${{ matrix.mod }}
      - name: Revisar texturas de ${{ matrix.mod }}
        run: |
          pip install pillow -q
          python3 tools/check_textures.py ${{ matrix.mod }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas de logica del casino
        if: matrix.mod == 'casino'
        run: |
          mkdir out
          javac -d out casino/src/main/java/com/casino/game/WheelLayout.java casino/src/main/java/com/casino/game/PlinkoLayout.java casino/src/main/java/com/casino/game/SlotLayout.java casino/src/main/java/com/casino/game/BlackjackGame.java casino/src/main/java/com/casino/game/BlackjackTable.java casino/src/main/java/com/casino/game/BlackjackLayout.java casino/src/main/java/com/casino/game/RouletteBets.java casino/src/main/java/com/casino/game/RouletteLayout.java casino/src/main/java/com/casino/game/RouletteWheel.java casino/src/main/java/com/casino/game/RouletteTable.java casino/tests/*.java
          for t in PlinkoTest WheelTest PegTest SlotTest BlackjackTest RouletteTest RouletteWheelTest; do java -cp out $t; done
      - name: Compilar ${{ matrix.mod }}
        working-directory: ${{ matrix.mod }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Arrancar servidor con ${{ matrix.mod }}
        run: bash tools/boot_server.sh ${{ matrix.mod }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-jar
          path: ${{ matrix.mod }}/build/libs/*.jar
