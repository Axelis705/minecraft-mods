name: Compilar mods

# Compila cada mod con Gradle real cada vez que se sube un cambio. El .jar queda descargable en la pestaña Actions.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [casino, pooltable, kensei, scardax, estructuras, cartas, show, autos]
    steps:
      - uses: actions/checkout@v4
      - name: Revisar recursos de ${{ matrix.mod }}
        run: python3 tools/check_resources.py ${{ matrix.mod }}
      - name: Revisar texturas de ${{ matrix.mod }}
        run: |
          pip install pillow -q
          python3 tools/check_textures.py ${{ matrix.mod }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas de logica del casino
        if: matrix.mod == 'casino'
        run: |
          mkdir out
          javac -d out casino/src/main/java/com/casino/game/WheelLayout.java casino/src/main/java/com/casino/game/PlinkoLayout.java casino/src/main/java/com/casino/game/SlotLayout.java casino/src/main/java/com/casino/game/BlackjackGame.java casino/src/main/java/com/casino/game/BlackjackTable.java casino/src/main/java/com/casino/game/BlackjackLayout.java casino/src/main/java/com/casino/game/RouletteBets.java casino/src/main/java/com/casino/game/RouletteLayout.java casino/src/main/java/com/casino/game/RouletteWheel.java casino/src/main/java/com/casino/game/RouletteTable.java casino/src/main/java/com/casino/game/PokerHands.java casino/src/main/java/com/casino/game/PokerTable.java casino/src/main/java/com/casino/game/ScratchCards.java casino/src/main/java/com/casino/game/CasinoPlan.java casino/tests/*.java
          for t in PlinkoTest WheelTest PegTest SlotTest BlackjackTest RouletteTest RouletteWheelTest PokerTest ScratchTest CasinoPlanTest; do java -cp out $t; done
      - name: Pruebas de logica del boliche
        if: matrix.mod == 'pooltable'
        run: |
          mkdir out
          javac -d out pooltable/src/main/java/com/pooltable/game/BowlingScore.java pooltable/src/main/java/com/pooltable/game/BowlingGame.java pooltable/src/main/java/com/pooltable/game/BowlingPhysics.java pooltable/src/main/java/com/pooltable/game/BowlingAim.java pooltable/src/main/java/com/pooltable/game/HockeyPhysics.java pooltable/src/main/java/com/pooltable/game/HockeyAI.java pooltable/src/main/java/com/pooltable/game/HockeyMatch.java pooltable/src/main/java/com/pooltable/game/VolleyMatch.java pooltable/src/main/java/com/pooltable/game/VolleyAI.java pooltable/tests/*.java
          for t in BowlingScoreTest BowlingPhysicsTest BowlingTuneTest HockeyTest VolleyTest; do java -cp out $t; done
      - name: Pruebas de conectividad de las estructuras
        if: matrix.mod == 'estructuras'
        run: |
          mkdir out
          W=estructuras/src/main/java/com/mundosdeaxelis/world
          javac -d out $W/StructBp.java $W/EstIds.java $W/Soporte.java $W/Arq.java $W/Linker.java $W/StructKit.java $W/StructDesigns.java $W/Design*.java $W/TorreInterior.java estructuras/tests/com/mundosdeaxelis/world/ConectividadTest.java
          java -cp out com.mundosdeaxelis.world.ConectividadTest
      - name: Pruebas de logica de las cartas
        if: matrix.mod == 'cartas'
        run: |
          mkdir out
          C=cartas/src/main/java/com/mundosdeaxelis/cartas
          javac -encoding UTF-8 -d out $C/CardData.java $C/CardRarity.java $C/CardDef.java $C/CardCategory.java $C/PackDef.java $C/Cards.java $C/PackRoller.java $C/AlbumLogic.java cartas/tests/PackRollerTest.java
          java -cp out PackRollerTest
      - name: Pruebas de logica del show
        if: matrix.mod == 'show'
        run: |
          mkdir out
          javac -encoding UTF-8 -d out show/src/main/java/com/showdeaxelis/game/*.java show/tests/ShowTest.java
          java -cp out ShowTest
      - name: Pruebas de logica de los autos
        if: matrix.mod == 'autos'
        run: |
          mkdir out
          javac -encoding UTF-8 -d out autos/src/main/java/com/autoscoleccion/game/*.java autos/tests/com/autoscoleccion/game/AutosTest.java
          java -cp out com.autoscoleccion.game.AutosTest
      - name: Compilar ${{ matrix.mod }}
        working-directory: ${{ matrix.mod }}
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Arrancar servidor con ${{ matrix.mod }}
        run: bash tools/boot_server.sh ${{ matrix.mod }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-jar
          path: ${{ matrix.mod }}/build/libs/*.jar
