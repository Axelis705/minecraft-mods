name: Sondeo de versiones Forge

# Baja el MDK oficial de Forge de cada versión, lo compila y guarda su plantilla y las librerías para compilar (classpath),
# para poder llevar el casino a varias versiones.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sondeo-versiones.yml'

jobs:
  mdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.21.1'
            java: '21'
          - mc: '1.21.4'
            java: '21'
          - mc: '26.2'
            java: '25'
          - mc: '26.3'
            java: '25'
    steps:
      - name: Buscar la versión de Forge
        id: v
        run: |
          curl -sS https://files.minecraftforge.net/net/minecraftforge/forge/promotions_slim.json -o promos.json
          V=$(python3 -c "import json;d=json.load(open('promos.json'))['promos'];print(d.get('${{ matrix.mc }}-recommended') or d.get('${{ matrix.mc }}-latest') or '')")
          echo "forge=$V" >> $GITHUB_OUTPUT
      - name: Bajar el MDK
        run: |
          F=${{ matrix.mc }}-${{ steps.v.outputs.forge }}
          curl -sSfL https://maven.minecraftforge.net/net/minecraftforge/forge/$F/forge-$F-mdk.zip -o mdk.zip
          mkdir mdk && cd mdk && unzip -q ../mdk.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compilar y sacar el classpath
        working-directory: mdk
        run: |
          chmod +x gradlew
          cat >> build.gradle <<'G'

          tasks.register('printCp') {
              doLast {
                  def f = file('cp.txt')
                  f.text = sourceSets.main.compileClasspath.files.join('\n')
              }
          }
          G
          ./gradlew build printCp --no-daemon -q 2>&1 | tail -20
          mkdir -p ../out/libs ../out/plantilla
          while read j; do [ -f "$j" ] && cp "$j" ../out/libs/; done < cp.txt
          cp -r build.gradle settings.gradle gradle.properties gradle gradlew src/main/resources ../out/plantilla/ 2>/dev/null || true
          find src -name "*.java" -exec cp {} ../out/plantilla/ \;
          du -sh ../out/libs; ls ../out/libs | head -100
      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.mc }}
          path: out
          retention-days: 7
