modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayTest="MATCH_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
# Simple Voice Chat es opcional: si está, los fantasmas tienen su canal, el organizador su altavoz y algunas pruebas separan la voz por salas
[[dependencies.${mod_id}]]
    modId="voicechat"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="axelis_core"
    mandatory=true
    versionRange="[1.4.0,)"
    ordering="AFTER"
    side="BOTH"
