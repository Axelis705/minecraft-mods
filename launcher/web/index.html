<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>El Coleccionista</title>
<style>
  :root {
    --oro: #d9a93a; --oro-osc: #7a5a1e; --texto: #f2e6cf; --apagado: #a89880; --vino: #5a0d16; --vino-cl: #8e1726;
    --tinta: rgba(16, 6, 9, .92); --rojo: #e0606a;
  }
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070304; color: var(--texto);
    font-family: "Segoe UI", system-ui, sans-serif; cursor: default; }
  /* el escenario: la pared y los telones (2D, se mueve poquito con el ratón) y encima la luz que parpadea */
  #fondo, #luz { position: absolute; inset: -16px; background-size: cover; background-position: center; image-rendering: pixelated; }
  #fondo { background-image: url(inicio_fondo.png); filter: brightness(.85); }
  #luz { background-image: url(inicio_luz.png); mix-blend-mode: screen; opacity: .9; }
  #escena { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* la tele vieja: rayas, grano y la viñeta */
  #rayas { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
  #grano { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .07; mix-blend-mode: screen; }
  #vineta { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 62% 48%, transparent 38%, rgba(0,0,0,.55) 75%, rgba(0,0,0,.92) 100%); }
  #negro { position: absolute; inset: 0; background: #000; pointer-events: none; opacity: 1; transition: opacity 1.6s ease; }
  #destello { position: absolute; left: 0; right: 0; top: 50%; height: 0; background: #fff; pointer-events: none; opacity: 0; }
  body.glitch #escena { transform: translate(var(--gx, 0), 0); filter: drop-shadow(3px 0 0 rgba(255,0,40,.6)) drop-shadow(-3px 0 0 rgba(0,220,255,.45)); }
  body.glitch #panel { transform: translateX(2px); }
  body.apagon #fondo, body.apagon #luz { opacity: .05; }

  /* la barra de arriba (se arrastra la ventana desde ahí) */
  #barra { position: absolute; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; justify-content: flex-end;
    padding: 0 6px; gap: 2px; z-index: 5; }
  #barra .arrastre { position: absolute; inset: 0; }
  #barra button { position: relative; z-index: 1; width: 34px; height: 26px; border: 0; background: transparent; color: var(--apagado);
    font: 15px "Segoe UI Symbol", "Segoe UI", sans-serif; cursor: pointer; border-radius: 3px; }
  #barra button:hover { background: rgba(142, 23, 38, .55); color: var(--texto); }
  #barra button.apagada { color: #5a4a3a; }

  /* el panel de la izquierda */
  #panel { position: absolute; left: 0; top: 0; bottom: 0; width: 430px; padding: 52px 0 0 54px; z-index: 4;
    background: linear-gradient(90deg, rgba(10,4,6,.88) 0, rgba(10,4,6,.78) 70%, rgba(10,4,6,0) 100%); }
  .el { font: 600 19px Georgia, "Times New Roman", serif; color: var(--apagado); letter-spacing: 3px; }
  h1 { margin: 2px 0 0; font: 700 44px Georgia, "Times New Roman", serif; letter-spacing: 1px; color: #e9d9b8;
    text-shadow: 3px 3px 0 #3a0008, 0 0 18px rgba(142, 23, 38, .55); white-space: nowrap; }
  h1 .tiembla { display: inline-block; color: var(--vino-cl); transform: translate(var(--tx, 0), var(--ty, 0)); }
  .linea { height: 1px; width: 330px; background: linear-gradient(90deg, var(--oro-osc), transparent); margin: 8px 0 6px; }
  .lema { font: italic 600 15px Georgia, serif; color: var(--apagado); }
  section { margin-top: 34px; width: 320px; animation: entra .6s ease both; }
  @keyframes entra { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  label { display: block; font-size: 12px; color: var(--apagado); margin: 12px 0 5px; letter-spacing: .5px; }
  input { width: 100%; height: 36px; padding: 0 12px; font: 15px "Segoe UI", sans-serif; color: var(--texto); background: rgba(28, 11, 14, .92);
    border: 1px solid var(--oro-osc); outline: none; border-radius: 2px; user-select: text; -webkit-user-select: text; }
  input:focus { border-color: var(--oro); box-shadow: 0 0 0 2px rgba(217, 169, 58, .18), 0 0 18px rgba(142, 23, 38, .35); }
  .aviso { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--rojo); }
  .aviso.bien { color: var(--oro); }
  .boton { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-width: 190px; height: 46px;
    padding: 0 26px; margin-top: 8px; font: 700 17px "Segoe UI", sans-serif; letter-spacing: 3px; color: var(--apagado);
    background: rgba(20, 6, 9, .95); border: 2px solid var(--oro-osc); cursor: pointer; overflow: hidden; transition: color .15s, border-color .15s; }
  .boton::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(90,13,22,.95), rgba(142,23,38,.75));
    transform: scaleX(0); transform-origin: left; transition: transform .25s ease; z-index: 0; }
  .boton span { position: relative; z-index: 1; }
  .boton:hover:not(:disabled) { color: var(--texto); border-color: var(--oro); }
  .boton:hover:not(:disabled)::before { transform: scaleX(1); }
  .boton:hover:not(:disabled) span::before { content: "› "; color: var(--oro); }
  .boton:disabled { cursor: default; color: #6a6058; border-color: #3a3028; }
  .boton.grande { min-width: 260px; height: 56px; font-size: 21px; letter-spacing: 6px; }
  .boton.latiendo { animation: late 1.1s ease-in-out infinite; }
  @keyframes late { 0%, 100% { box-shadow: 0 0 0 rgba(142,23,38,0); } 50% { box-shadow: 0 0 26px rgba(142,23,38,.75); } }
  .hola { font: 600 20px Georgia, serif; color: var(--texto); }
  .chico { font-size: 11px; color: #8a7a68; margin-top: 4px; }
  .chico a { color: #b09a80; cursor: pointer; text-decoration: underline; }
  .rams { display: flex; gap: 8px; margin-top: 2px; }
  .ram { width: 70px; height: 36px; font: 600 14px "Segoe UI", sans-serif; color: var(--apagado); background: rgba(20, 6, 9, .95);
    border: 1px solid var(--oro-osc); cursor: pointer; }
  .ram:hover:not(:disabled) { color: var(--texto); border-color: var(--oro); }
  .ram.si { color: var(--texto); background: var(--vino-cl); border-color: var(--oro); box-shadow: 0 0 14px rgba(142,23,38,.6); }
  .ram:disabled { color: #4a4038; border-color: #2a2420; cursor: not-allowed; text-decoration: line-through; }
  .progreso { height: 8px; margin-top: 16px; background: rgba(28, 11, 14, .92); border: 1px solid var(--oro-osc); }
  .progreso div { height: 100%; width: 0; background: linear-gradient(90deg, var(--vino), var(--vino-cl), #c0303f); transition: width .3s; }
  .estado { margin-top: 8px; min-height: 36px; font-size: 13px; color: var(--apagado); line-height: 1.35; }
  .estado.bien { color: var(--oro); }
  .estado.mal { color: var(--rojo); }
  #version { position: absolute; right: 12px; bottom: 8px; font-size: 11px; color: #6a5a48; z-index: 4; }
  /* lo que dice (abajo, centrado en él) */
  #subtitulo { position: absolute; left: 62%; bottom: 30px; transform: translateX(-50%); padding: 6px 14px; font: 16px "Segoe UI", sans-serif;
    color: #fff; background: rgba(0, 0, 0, .72); border-left: 2px solid var(--vino-cl); white-space: nowrap; opacity: 0; transition: opacity .3s;
    z-index: 4; }
  #subtitulo b { color: #e0606a; font-size: 11px; letter-spacing: 1px; display: block; }
</style>
</head>
<body>
<div id="fondo"></div>
<div id="luz"></div>
<canvas id="escena"></canvas>
<canvas id="grano" width="320" height="180"></canvas>
<div id="rayas"></div>
<div id="vineta"></div>

<div id="barra">
  <div class="arrastre pywebview-drag-region"></div>
  <button id="b-musica" title="Música">♪</button>
  <button id="b-min" title="Minimizar">—</button>
  <button id="b-cerrar" title="Cerrar">✕</button>
</div>

<main id="panel">
  <div class="el">EL</div>
  <h1 id="titulo">COLECCIONISTA</h1>
  <div class="linea"></div>
  <div class="lema">Un evento de Axelis</div>

  <section id="p-entrar">
    <div class="chico" style="font-size:13px;color:var(--apagado)">Entra con el usuario y la contraseña que te dio Axelis</div>
    <label for="usuario">USUARIO</label>
    <input id="usuario" autocomplete="off" spellcheck="false">
    <label for="clave">CONTRASEÑA</label>
    <input id="clave" type="password">
    <div class="aviso" id="aviso-entrar"></div>
    <button class="boton" id="b-entrar"><span>ENTRAR</span></button>
  </section>

  <section id="p-jugar" hidden>
    <div class="hola" id="hola">Hola</div>
    <div class="chico"><a id="b-salir">No soy yo (cerrar sesión)</a></div>
    <label>MEMORIA PARA MINECRAFT</label>
    <div class="rams" id="rams"></div>
    <div class="chico" id="ram-info"></div>
    <button class="boton grande" id="b-jugar"><span>JUGAR</span></button>
    <div class="progreso"><div id="barra-avance"></div></div>
    <div class="estado" id="estado">Presiona Jugar: se instala lo que falte y se abre Minecraft.</div>
  </section>
</main>

<div id="subtitulo"><b>EL COLECCIONISTA</b><span></span></div>
<div id="version"></div>
<div id="destello"></div>
<div id="negro"></div>

<script src="three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
